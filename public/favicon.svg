<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#148342" />
      <stop offset="50%" stop-color="#0F7B3C" />
      <stop offset="100%" stop-color="#084C24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Steam waves -->
  <path d="M25 15 C23 18, 27 20, 25 23" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 12 C30 16, 34 18, 32 22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M39 15 C37 18, 41 20, 39 23" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Pot Rim -->
  <ellipse cx="32" cy="27" rx="17" ry="3.5" fill="#F8F5F0" />
  <ellipse cx="32" cy="27" rx="15" ry="2.5" fill="#E5E0D8" />

  <!-- Pot Base -->
  <path d="M15 27 C15 39, 21 47, 32 47 C43 47, 49 39, 49 27 Z" fill="#FFFFFF" />

  <!-- Pot Handles -->
  <path d="M14 31 C10 31, 10 37, 14 37" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M50 31 C54 31, 54 37, 50 37" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Naija 'N' -->
  <path d="M27 34 L27 42 M27 35 L37 42 M37 34 L37 42" fill="none" stroke="#0F7B3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Gold base accent -->
  <circle cx="32" cy="53" r="2.5" fill="url(#goldGrad)" />
</svg>
