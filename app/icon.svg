<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Nigerian Forest Green to Deep Emerald -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E6B33" />
      <stop offset="50%" stop-color="#094A23" />
      <stop offset="100%" stop-color="#052E15" />
    </linearGradient>

    <!-- Pot Body Gradient -->
    <linearGradient id="potGrad" x1="14" y1="23" x2="50" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="60%" stop-color="#0F7635" />
      <stop offset="100%" stop-color="#094F24" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Soft Steam Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Badge Container with Gold Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#bgGrad)" stroke="#F5C518" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Inner subtle border glow -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13" fill="none" stroke="#22C55E" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Rising Steam Curls (Golden Amber) -->
  <g filter="url(#glow)">
    <path d="M25 9.5 C22 13.5, 28 16.5, 25 20.5" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M32 7 C29 11, 35 14.5, 32 18.5" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M39 9.5 C36 13.5, 42 16.5, 39 20.5" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Pot Rim (Double Ellipse for 3D depth) -->
  <ellipse cx="32" cy="24" rx="19.5" ry="5.2" fill="#15803D" stroke="#EAB308" stroke-width="0.9" />
  <ellipse cx="32" cy="24" rx="16.5" ry="3.5" fill="#0A5B2C" />

  <!-- Pot Main Body -->
  <path d="M13.5 24 C13.5 40.5, 20.5 50.5, 32 50.5 C43.5 50.5, 50.5 40.5, 50.5 24 Z" fill="url(#potGrad)" />

  <!-- Cast Iron Handles in Rich Gold -->
  <path d="M13 28 C7.5 28, 7.5 35, 13 35" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M51 28 C56.5 28, 56.5 35, 51 35" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Naija 'N' Monogram (Clean Bold White) -->
  <path d="M25.5 32.5 V43 M25.5 33.5 L38.5 43 M38.5 32.5 V43" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Base Heat Ember (Flame Orange) -->
  <circle cx="32" cy="55.5" r="2.2" fill="#F97316" />
  <circle cx="32" cy="55.5" r="1.1" fill="#FEF08A" />
</svg>
